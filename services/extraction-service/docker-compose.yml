services:
  extraction-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-extraction-service:latest
    container_name: pdf-extraction-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - PERSISTENCE_SERVICE_URL=http://persistence.localhost
    deploy:
      replicas: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extraction-service.rule=Host(`extraction.localhost`)"
      - "traefik.http.routers.extraction-service.entrypoints=web"
      - "traefik.http.services.extraction-service.loadbalancer.server.port=8000"
    networks:
      - mired

networks:
  mired:
    external: true
