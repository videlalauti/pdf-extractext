[project]
name = "pdf-extractext"
version = "0.1.0"
description = "API para extracción y procesamiento de PDFs con Clean Architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.9.0",
    "motor>=3.6.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["src*", "shared*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    # B008: `Depends(...)` como default es el idioma de FastAPI para DI
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Los fixtures de PDF usan separadores de 2 bytes por entrada de xref
# (10+1+5+1+1+2 = 20 bytes); el espacio final es parte del formato.
"tests/services/test_extraction_service.py" = ["W291"]
"tests/unit/test_pdf_text_extractor.py" = ["W291"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
]
