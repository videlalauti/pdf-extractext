version: "3.8"

include:
  - infrastructure/traefik/docker-compose.yml
  - infrastructure/mongodb/docker-compose.yml

services:
  validation-service:
    build:
      context: ./services/validation-service
      dockerfile: Dockerfile
    image: pdf-validation-service:latest
    container_name: validation-service
    restart: unless-stopped
    environment:
      - EXTRACTION_SERVICE_URL=http://extraction.pdf.localhost
    deploy:
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.validation-service.rule=Host(`validation.pdf.localhost`)"
      - "traefik.http.routers.validation-service.entrypoints=web"
      - "traefik.http.routers.validation-service.tls=true"
      - "traefik.http.middlewares.validation-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.5"
      - "traefik.http.routers.validation-service.middlewares=validation-cb"
      - "traefik.http.services.validation-service.loadbalancer.server.port=8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mired

  extraction-service:
    build:
      context: ./services/extraction-service
      dockerfile: Dockerfile
    image: pdf-extraction-service:latest
    container_name: extraction-service
    restart: unless-stopped
    environment:
      - PERSISTENCE_SERVICE_URL=http://persistence.pdf.localhost
    deploy:
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extraction-service.rule=Host(`extraction.pdf.localhost`)"
      - "traefik.http.routers.extraction-service.entrypoints=web"
      - "traefik.http.routers.extraction-service.tls=true"
      - "traefik.http.middlewares.extraction-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.5"
      - "traefik.http.routers.extraction-service.middlewares=extraction-cb"
      - "traefik.http.services.extraction-service.loadbalancer.server.port=8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mired

  persistence-service:
    build:
      context: ./services/persistence-service
      dockerfile: Dockerfile
    image: pdf-persistence-service:latest
    container_name: persistence-service
    restart: unless-stopped
    environment:
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_ROOT_USERNAME=${ROOT_USERNAME:-admin}
      - MONGODB_ROOT_PASSWORD=${ROOT_PASSWORD:-changeme}
    deploy:
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.persistence-service.rule=Host(`persistence.pdf.localhost`)"
      - "traefik.http.routers.persistence-service.entrypoints=web"
      - "traefik.http.routers.persistence-service.tls=true"
      - "traefik.http.middlewares.persistence-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.5"
      - "traefik.http.routers.persistence-service.middlewares=persistence-cb"
      - "traefik.http.services.persistence-service.loadbalancer.server.port=8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mired

networks:
  mired:
    external: true
